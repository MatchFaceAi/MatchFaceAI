<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Football Twin | MatchFace AI</title>
    <style>
        :root { --primary: #00ff88; --bg: #0b0e11; --card: #15191e; --text: #ffffff; }
        body { background-color: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; text-align: center; }
        .container { width: 90%; max-width: 450px; padding: 30px; background: var(--card); border-radius: 20px; box-shadow: 0 10px 40px rgba(0,0,0,0.6); border: 1px solid #2a2e35; position: relative; }
        h1 { color: var(--primary); font-size: 26px; letter-spacing: -1px; margin-bottom: 5px; }
        p { color: #8a919e; font-size: 14px; margin-bottom: 20px; }
        select, .btn { width: 100%; padding: 14px; margin: 10px 0; border-radius: 12px; border: 1px solid #2a2e35; background: #1f2329; color: white; cursor: pointer; font-size: 16px; transition: 0.3s; }
        .btn { background: var(--primary); color: #000; font-weight: 800; border: none; margin-top: 20px; text-transform: uppercase; }
        .btn-share { background: #25d366; color: white; margin-top: 10px; font-size: 14px; }
        .btn-twitter { background: #1da1f2; color: white; margin-top: 5px; font-size: 14px; }
        #loading { display: none; margin: 30px 0; }
        .spinner { width: 50px; height: 50px; border: 5px solid rgba(255,255,255,0.1); border-left-color: var(--primary); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #result { display: none; animation: zoomIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes zoomIn { from { transform: scale(0.5); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .player-img { width: 220px; height: 220px; border-radius: 50%; object-fit: cover; border: 5px solid var(--primary); box-shadow: 0 0 20px rgba(0,255,136,0.3); margin-bottom: 15px; }
        label { display: block; text-align: left; font-size: 12px; color: var(--primary); margin-left: 5px; font-weight: bold; }
        footer { margin-top: 20px; font-size: 10px; color: #444; }
        footer a { color: #444; text-decoration: none; }
    </style>
</head>
<body>

<div class="container">
    <div id="setup">
        <h1>AI Football Twin</h1>
        <p>Global Scout Lookalike Engine</p>
        
        <label>HAIR COLOR</label>
        <select id="hairColor">
            <option value="dark">Black / Dark Brown</option>
            <option value="light">Blonde / Light Brown</option>
        </select>

        <label>SKIN TONE</label>
        <select id="skinColor">
            <option value="esmer">Tan / Dark</option>
            <option value="acik">Fair / Light</option>
        </select>

        <div id="upload-area" onclick="document.getElementById('fileInput').click()" style="border: 2px dashed #3a3f47; padding: 25px; border-radius: 12px; margin-top: 15px; cursor: pointer; background: #1a1e23;">
            <span style="font-size: 14px;">📸 Upload Photo to Analyze</span>
            <input type="file" id="fileInput" hidden accept="image/*">
        </div>

        <button class="btn" onclick="startAnalysis()">Find My Match</button>
    </div>

    <div id="loading">
        <div class="spinner"></div>
        <p id="status" style="margin-top: 15px; font-weight: bold;">Analyzing DNA...</p>
    </div>

    <div id="result">
        <p style="color: var(--primary); font-weight: bold; margin-bottom: 5px;">WE FOUND YOUR TWIN!</p>
        <img id="player-img" class="player-img" src="" alt="Player">
        <h2 id="player-name" style="margin: 5px 0;"></h2>
        <p id="match-score" style="font-size: 18px; color: #fff; margin-bottom: 15px;"></p>
        
        <button class="btn btn-share" onclick="shareWhatsApp()">Share on WhatsApp</button>
        <button class="btn btn-twitter" onclick="shareTwitter()">Share on X (Twitter)</button>
        <button class="btn" onclick="location.reload()" style="background: #333; color: #fff; font-size: 12px;">Try Another Photo</button>
    </div>

    <footer>
        <a href="#">Privacy Policy</a> | © 2026 MatchFace AI
    </footer>
</div>

<script>
    const players = [
        { name: "Cristiano Ronaldo", type: "dark-acik", img: "https://img.a.transfermarkt.technology/portrait/header/8198-1694609670.jpg" },
        { name: "Lionel Messi", type: "dark-acik", img: "https://img.a.transfermarkt.technology/portrait/header/28003-1710080339.jpg" },
        { name: "Arda Güler", type: "dark-acik", img: "https://img.a.transfermarkt.technology/portrait/header/718682-1691418701.jpg" },
        { name: "Robert Lewandowski", type: "dark-acik", img: "https://img.a.transfermarkt.technology/portrait/header/38253-1701118182.jpg" },
        { name: "Harry Kane", type: "dark-acik", img: "https://img.a.transfermarkt.technology/portrait/header/132098-1700210210.jpg" },
        { name: "Mauro Icardi", type: "light-acik", img: "https://img.a.transfermarkt.technology/portrait/header/199005-1695034637.jpg" },
        { name: "Erling Haaland", type: "light-acik", img: "https://img.a.transfermarkt.technology/portrait/header/418560-1718005697.jpg" },
        { name: "Kevin De Bruyne", type: "light-acik", img: "https://img.a.transfermarkt.technology/portrait/header/88755-1712217647.jpg" },
        { name: "Kylian Mbappé", type: "dark-esmer", img: "https://img.a.transfermarkt.technology/portrait/header/342229-1682683695.jpg" },
        { name: "Neymar Jr", type: "dark-esmer", img: "https://img.a.transfermarkt.technology/portrait/header/68273-1715764042.jpg" },
        { name: "Vinícius Júnior", type: "dark-esmer", img: "https://img.a.transfermarkt.technology/portrait/header/371998-1664869400.jpg" },
        { name: "Jude Bellingham", type: "dark-esmer", img: "https://img.a.transfermarkt.technology/portrait/header/581671-1693987379.jpg" },
        { name: "Lamine Yamal", type: "dark-esmer", img: "https://img.a.transfermarkt.technology/portrait/header/927231-1716892556.jpg" },
        { name: "Mohamed Salah", type: "dark-esmer", img: "https://img.a.transfermarkt.technology/portrait/header/131864-1714413348.jpg" }
    ];

    let lastMatch = "";

    function startAnalysis() {
        if(!document.getElementById('fileInput').files[0]) { alert("Please upload a photo first!"); return; }
        const userType = document.getElementById('hairColor').value + "-" + document.getElementById('skinColor').value;
        document.getElementById('setup').style.display = 'none';
        document.getElementById('loading').style.display = 'block';

        setTimeout(() => {
            let filtered = players.filter(p => p.type === userType);
            const player = filtered[Math.floor(Math.random() * filtered.length)] || players[0];
            lastMatch = player.name;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('result').style.display = 'block';
            document.getElementById('player-img').src = player.img;
            document.getElementById('player-name').innerText = player.name;
            document.getElementById('match-score').innerText = (Math.floor(Math.random() * 5) + 93) + "% Match!";
        }, 3000);
    }

    function shareWhatsApp() {
        const text = `I just found my football twin! I look like ${lastMatch} %95! Check yours here: ${window.location.href}`;
        window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text)}`, '_blank');
    }

    function shareTwitter() {
        const text = `I am the twin of ${lastMatch}! Found by AI. Check yours:`;
        window.open(`https://twitter.com/intent/tweet?text=${encodeURIComponent(text)}&url=${encodeURIComponent(window.location.href)}`, '_blank');
    }
</script>
</body>
</html>
